<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="checkout-container">

    <h1>🛠 Admin Dashboard</h1>

    <form id="product-form">

        <input
            type="text"
            id="name"
            placeholder="Product Name"
            required>

        <input
            type="number"
            id="price"
            placeholder="Price"
            required>

        <input
            type="text"
            id="category"
            placeholder="Category"
            required>

        <input
            type="number"
            id="stock"
            placeholder="Stock"
            required>

        <input
            type="text"
            id="image"
            placeholder="Image filename (example: shoes.jpg)"
            required>

        <textarea
            id="description"
            placeholder="Description"
            required>
        </textarea>

        <button type="submit">

            Add Product

        </button>

    </form>

    <hr>

    <h2>Products</h2>

    <div id="admin-products"></div>

</div>

<script src="/js/admin.js"></script>

</body>

</html>
